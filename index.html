<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Packet Compressor</title>
<style>
body{background:#0f172a;color:white;font-family:Arial;text-align:center;padding:20px}
h1{color:#22c55e}
textarea{width:100%;height:120px;border-radius:12px;padding:12px;font-size:16px;box-sizing:border-box}
button{width:100%;padding:14px;margin-top:10px;border:none;border-radius:12px;font-size:18px;font-weight:bold;color:white}
.green{background:#22c55e}.blue{background:#3b82f6}
.box{background:#1e293b;padding:15px;border-radius:12px;margin-top:15px;text-align:left;word-break:break-all}
</style>
</head>
<body>
<h1>📦 Data Packet Compressor</h1>
<p>Text ni compress chesi packet size thagginchu</p>
<textarea id="inputText" placeholder="Ikkada text type chey mawa...">Hello mawa, idi na first website</textarea>
<button class="green" onclick="compressData()">COMPRESS 📦</button>
<button class="blue" onclick="decompressData()">DECOMPRESS 🔓</button>
<div class="box"><b>Original:</b> <span id="orig">0</span> bytes<br><b>Compressed:</b> <span id="comp">0</span> bytes<br><b>Saved:</b> <span id="saved">0%</span></div>
<div class="box"><b>Result:</b><br><br><span id="result">Ikkada result vasthundi...</span></div>
<script>
let lastCompressed="";
function toBase64(b){let s="";let u=new Uint8Array(b);for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function fromBase64(s){let b=atob(s);let u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function compressData(){
let t=document.getElementById("inputText").value;
if(!t){alert("Mundhu text type chey mawa!");return}
document.getElementById("result").innerText="Compress avthundi...";
try{
let st=new Blob([t]).stream().pipeThrough(new CompressionStream("gzip"));
let buf=await new Response(st).arrayBuffer();
let b64=toBase64(buf);lastCompressed=b64;
let o=new Blob([t]).size;let c=buf.byteLength;
document.getElementById("orig").innerText=o;
document.getElementById("comp").innerText=c;
document.getElementById("saved").innerText=Math.max(0,Math.round((1-c/o)*100))+"%";
document.getElementById("result").innerText=b64;
}catch(e){document.getElementById("result").innerText="Error: "+e.message}
}
async function decompressData(){
let toDecode=lastCompressed||document.getElementById("inputText").value.trim();
if(!toDecode){alert("Mundhu Compress chey mawa!");return}
try{
let bytes=fromBase64(toDecode);
let st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
let txt=await new Response(st).text();
document.getElementById("result").innerText=txt;
document.getElementById("inputText").value=txt;
}catch(e){document.getElementById("result").innerText="Mundhu Compress kottu mawa!"}
}
</script>
</body>
</html>
